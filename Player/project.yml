name: HarkPlayer
options:
  projectFormat: xcode16_0
  bundleIdPrefix: com.ouyanghong
  deploymentTarget:
    iOS: "18.0"
packages:
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    exactVersion: 3.6.0
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2
    exactVersion: 4.0.3
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.1.0-n9.0.2
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.18.5"
    CURRENT_PROJECT_VERSION: "52"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  HarkPlayer:
    type: application
    platform: iOS
    sources: [App, Resources]
    dependencies:
      - package: VLCKitSPM
        product: VLCKitSPM
      - package: AMSMB2
        product: AMSMB2
        embed: true
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ouyanghong.harkplayer
        # MobileVLCKit exports its own FFmpeg 4.4 / libass / freetype; force MPVKit's static copies
        # into the app so libmpv binds to FFmpeg 9 instead (set by CI as MPV_FORCE_LOAD).
        OTHER_LDFLAGS: "$(inherited) $(MPV_FORCE_LOAD)"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Hark 影音"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "用 iPhone 本机语音识别为影片生成 AI 字幕"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "用于访问局域网内的 SMB、WebDAV、Emby、Jellyfin 媒体服务器"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: YES
