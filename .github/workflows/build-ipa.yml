name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    paths: ["App/**", "project.yml", ".github/workflows/build-ipa.yml"]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project HarkRSS.xcodeproj -scheme HarkRSS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HarkRSS.app Payload/
          zip -qry HarkRSS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HarkRSS-unsigned-ipa
          path: HarkRSS-unsigned.ipa
