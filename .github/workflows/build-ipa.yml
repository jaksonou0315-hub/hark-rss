name: Build unsigned IPA
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "发布到 release latest"
        type: boolean
        default: false
  push:
    paths: ["App/**", "Widget/**", "Support/**", "Resources/**", "project.yml", ".github/workflows/build-ipa.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Check online voice token
        run: |
          mkdir -p /tmp/gec && cp App/EdgeTTS.swift /tmp/gec/
          cat > /tmp/gec/main.swift <<'SW'
          import Foundation
          let t = EdgeGEC.token(unix: 1762487000)
          print("GEC=\(t)")
          guard t == "C2E5839FF8AE0608-525FFE430A020CB56BEE4BBC2F9E34EFE2769FC5234B205A798240D3AF82DCCA" else { print("GEC MISMATCH"); exit(1) }
          do {
              let d = try await EdgeTTS.synthesize("你好，这是测试。", voice: "zh-CN-XiaoxiaoNeural", rate: 0, pitch: 0)
              print("EDGE_OK bytes=\(d.count)")
          } catch { print("EDGE_FAIL \(error)") }
          SW
          swiftc -o /tmp/gec/gec /tmp/gec/*.swift
          /tmp/gec/gec
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project HarkRSS.xcodeproj -scheme HarkRSS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|never)|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
          test -x build/Build/Products/Release-iphoneos/HarkRSS.app/HarkRSS
      - name: Show errors
        if: failure()
        run: grep -n "error:" build.log | head -60 || true
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HarkRSS.app Payload/
          ls Payload/HarkRSS.app/PlugIns || true
          zip -qry HarkRSS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HarkRSS-unsigned-ipa
          path: HarkRSS-unsigned.ipa
      - name: Hand-over copy in log
        # Test builds reach the user without touching the release page: the IPA is printed base64 in this log.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: |
          echo "IPASHA=$(shasum -a 256 HarkRSS-unsigned.ipa | cut -d' ' -f1)"
          base64 -i HarkRSS-unsigned.ipa | fold -w 1000 | sed 's/^/IPA64:/'
      - name: Publish release
        # Only when started by hand with publish ticked; pushes just build an artifact.
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HarkRSS-unsigned.ipa --title "HarkRSS 不签名 IPA" --notes "自动构建 ${{ github.sha }}" --latest
