name: Build HarkPlayer unsigned IPA
on:
  workflow_dispatch:
  push:
    paths: ["Player/**", ".github/workflows/build-player.yml"]
permissions:
  contents: read
concurrency:
  group: build-player
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: Player
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - uses: actions/cache@v4
        with:
          path: Player/build/SourcePackages
          key: spm-player-${{ hashFiles('Player/project.yml') }}
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project HarkPlayer.xcodeproj -scheme HarkPlayer -clonedSourcePackagesDirPath build/SourcePackages
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project HarkPlayer.xcodeproj -scheme HarkPlayer -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error:|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/HarkPlayer.app
      - name: Show errors
        if: failure()
        run: grep -n "error:" build.log | sort -u | head -80 || true
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HarkPlayer.app Payload/
          ls Payload/HarkPlayer.app/Frameworks || true
          zip -qry HarkPlayer-unsigned.ipa Payload
          ls -la HarkPlayer-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: HarkPlayer-unsigned-ipa
          path: Player/HarkPlayer-unsigned.ipa
          retention-days: 7
